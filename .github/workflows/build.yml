name: Build and test images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish_arch_images:
        required: true
        type: boolean

env:
  HARBOR_IMAGE: registry.hanada.info/hanada/dnsmgr-helper
  DOCKERHUB_IMAGE: docker.io/hanadalee/dnsmgr-helper
  GHCR_IMAGE: ghcr.io/hanadalee/dnsmgr-helper

jobs:
  build:
    name: Test ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build verification image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: verify
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          tags: dnsmgr-helper-test:${{ inputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=dnsmgr-helper-verify-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=dnsmgr-helper-verify-${{ matrix.suffix }}

      - name: Build production architecture image
        if: inputs.publish_arch_images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          build-args: |
            APP_VERSION=${{ inputs.version }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
            ${{ env.GHCR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=dnsmgr-helper-runtime-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=dnsmgr-helper-runtime-${{ matrix.suffix }}

      - name: Verify production image
        if: inputs.publish_arch_images
        shell: bash
        env:
          PRODUCTION_IMAGE: ${{ env.GHCR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
        run: |
          set -euo pipefail
          docker run --rm "$PRODUCTION_IMAGE" node --check dist/server.js

      - name: Log in to Harbor
        if: inputs.publish_arch_images
        uses: docker/login-action@v4
        with:
          registry: registry.hanada.info
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Docker Hub
        if: inputs.publish_arch_images
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: inputs.publish_arch_images
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture images
        if: inputs.publish_arch_images
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ARCH_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          for image in "$HARBOR_IMAGE" "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker push "${image}:${VERSION}-${ARCH_SUFFIX}"
          done
