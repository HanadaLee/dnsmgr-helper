name: CI and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Read version and determine release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_needed: ${{ steps.version.outputs.release_needed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          version="${version#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2,4}$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          if [[ "$version" != "$package_version" ]]; then
            echo "VERSION ($version) does not match package.json ($package_version)" >&2
            exit 1
          fi

          release_needed=false
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Version ${version} is already tagged; running tests only."
          else
            release_needed=true
            echo "Version ${version} is not tagged; publishing or retrying its release."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs:
      - prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish_arch_images: ${{ needs.prepare.outputs.release_needed == 'true' }}
    secrets: inherit

  publish:
    name: Publish manifests and release
    if: needs.prepare.outputs.release_needed == 'true'
    needs:
      - prepare
      - build
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
