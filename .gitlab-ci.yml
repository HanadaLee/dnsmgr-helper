variables:
  HARBOR_IMAGE: registry.hanada.info/hanada/dnsmgr-helper
  DOCKER_BUILDKIT: "1"

stages:
  - verify
  - build
  - manifest

.verify-job:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - |
      set -eu

      APP_VERSION="$(tr -d '[:space:]' < VERSION)"
      APP_VERSION="${APP_VERSION#v}"

      if [ -z "$APP_VERSION" ]; then
        echo "VERSION file is empty" >&2
        exit 1
      fi

      VERSION="${APP_VERSION}"
      export APP_VERSION VERSION
      echo "Verifying dnsmgr-helper ${VERSION}"

.docker-job:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "ext"'
  before_script:
    - |
      set -eu

      APP_VERSION="$(tr -d '[:space:]' < VERSION)"
      APP_VERSION="${APP_VERSION#v}"

      if [ -z "$APP_VERSION" ]; then
        echo "VERSION file is empty" >&2
        exit 1
      fi

      VERSION="${APP_VERSION}"
      export APP_VERSION VERSION
      echo "Building dnsmgr-helper ${VERSION}"
    - |
      printf '%s' "$HARBOR_PASSWORD" | docker login registry.hanada.info --username "$HARBOR_USERNAME" --password-stdin

verify:
  extends: .verify-job
  stage: verify
  tags:
    - debian-x86_64
  script:
    - |
      docker build \
        --pull \
        --target verify \
        --tag "dnsmgr-helper:verify-${CI_COMMIT_SHORT_SHA}" \
        .
  after_script:
    - docker image rm "dnsmgr-helper:verify-${CI_COMMIT_SHORT_SHA}" || true

build-amd64:
  extends: .docker-job
  stage: build
  tags:
    - debian-x86_64
  script:
    - |
      docker build \
        --pull \
        --build-arg APP_VERSION="${VERSION}" \
        --tag "${HARBOR_IMAGE}:${VERSION}-amd64" \
        .

      docker push "${HARBOR_IMAGE}:${VERSION}-amd64"

build-arm64:
  extends: .docker-job
  stage: build
  tags:
    - debian-aarch64
  script:
    - |
      docker build \
        --pull \
        --build-arg APP_VERSION="${VERSION}" \
        --tag "${HARBOR_IMAGE}:${VERSION}-arm64" \
        .

      docker push "${HARBOR_IMAGE}:${VERSION}-arm64"

create-manifest:
  extends: .docker-job
  stage: manifest
  tags:
    - debian-x86_64
  needs:
    - build-amd64
    - build-arm64
  script:
    - |
      docker manifest inspect "${HARBOR_IMAGE}:${VERSION}-amd64"
      docker manifest inspect "${HARBOR_IMAGE}:${VERSION}-arm64"

      docker manifest create --amend "${HARBOR_IMAGE}:${VERSION}" \
        --amend "${HARBOR_IMAGE}:${VERSION}-amd64" \
        --amend "${HARBOR_IMAGE}:${VERSION}-arm64"
      docker manifest push --purge "${HARBOR_IMAGE}:${VERSION}"

      docker manifest create --amend "${HARBOR_IMAGE}:latest" \
        --amend "${HARBOR_IMAGE}:${VERSION}-amd64" \
        --amend "${HARBOR_IMAGE}:${VERSION}-arm64"
      docker manifest push --purge "${HARBOR_IMAGE}:latest"
